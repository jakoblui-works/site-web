<!doctype html>
<!-- Dark-only: the class is fixed. To add light mode, see `ThemeToggle` in shared-ui. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jakob Lui - Product Engineer</title>
    <!-- Shared by all sites (from web-template). The SVG for modern browsers; the ICO for the rest
         (`sizes="32x32"`, not "any", or Chrome picks the ICO over the SVG). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Static on purpose: link previews and crawlers don't run JavaScript, so every URL shares
         these. -->
    <meta name="description" content="I build products end to end, from interface to infrastructure. Half the job is knowing what not to build." />
    <link rel="canonical" href="https://jakoblui.com/" />
    <!-- The surface's background (`.xray-surface-bg`), in hex. -->
    <meta name="theme-color" content="#010002" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jakoblui.com/" />
    <meta property="og:title" content="Jakob Lui - Product Engineer" />
    <meta property="og:description" content="I build products end to end, from interface to infrastructure. Half the job is knowing what not to build." />

    <!-- The app's og:image lines (1200 × 630, with og:image:width, og:image:height and
         og:image:alt) go below, a line away from the template's, so template updates don't
         conflict with them. cv-web and site-web render theirs from a Storybook story. -->

    <meta property="og:image" content="https://jakoblui.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Product Engineer, Jakob Lui Abramson, over a circuit-board diagram of the jakoblui.com infrastructure." />

    <!-- Without it, Discord and X show a small thumbnail instead of the large card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The prerendered page is `/` with the x-ray closed; on an `?xray` link it's hidden until the
         app renders the open x-ray, so the hero doesn't show first (see `styles.css`). -->
    <script>
      if (new URLSearchParams(location.search).has("xray"))
        document.documentElement.setAttribute("data-xray-link", "");
    </script>

    <script>
      // Runs before the first paint so a visit from another site's link starts under the cover,
      // which shared-ui then slides off; a cold load is never covered, and the cover clears by
      // itself after a second if shared-ui never does. The names are shared-ui's
      // SITE_TRANSITION_ATTRIBUTE, SITE_TRANSITION_TO_ATTRIBUTE, SITE_TRANSITION_COOKIE and
      // SITE_TRANSITION_STATES; the cookie's Domain is its `cookieDomain`.
      (function () {
        var root = document.documentElement;
        var mark = "data-site-transition";
        var clear = function () {
          root.removeAttribute(mark);
          root.removeAttribute("data-site-transition-to");
        };
        // The signal: this host's arrival cookie, deleted once read. False for none or another host's.
        var takeSignal = function () {
          var cookies = document.cookie.split("; ");
          var found = false;
          for (var i = 0; i < cookies.length; i++)
            if (cookies[i] === "site-transition=" + location.host) found = true;
          if (!found) return false;
          var host = location.hostname;
          var labels = host.split(".");
          var single = host.indexOf(":") >= 0 || /^\d+(\.\d+){3}$/.test(host) || labels.length < 2;
          document.cookie =
            "site-transition=; " +
            (single ? "" : "Domain=" + labels.slice(-2).join(".") + "; ") +
            "path=/; max-age=0; SameSite=Lax";
          return true;
        };
        // Only while it still reads `covered`: `revealing` is shared-ui's slide, which it finishes
        // (or clears by its own fallback), and `leaving` is a click on another site's link.
        var armClear = function () {
          setTimeout(function () {
            if (root.getAttribute(mark) === "covered") clear();
          }, 1000);
        };
        if (document.prerendering === true) {
          root.setAttribute(mark, "covered");
          // Registered before shared-ui's, so the mark is gone at activation when there's no signal.
          document.addEventListener(
            "prerenderingchange",
            function () {
              if (takeSignal()) armClear();
              else clear();
            },
            { once: true }
          );
        } else if (takeSignal()) {
          root.setAttribute(mark, "covered");
          armClear();
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
