server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header 'Access-Control-Allow-Origin' '*' always;
        # Every page is a real file (the site is one page; `?xray=…` is still `/`), so anything
        # else is a 404, not the home page under another URL.
        try_files $uri $uri/ =404;
    }
}