# Build files under /assets/ have a content hash in their names, so they never change: cached for a
# year. Everything else (the HTML, robots.txt, icons, og.png) revalidates, so a deploy shows at once.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # No nginx version in headers and error pages.
    server_tokens off;

    # HTML is compressed by default; these are the other text types the site and Storybook serve.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        # One location, so both headers apply (a nested location's add_header would replace them).
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Cache-Control $cache_control;
        # Every page is a real file (the site is one page; `?xray=…` is still `/`), so anything
        # else is a 404, not the home page under another URL.
        try_files $uri $uri/ =404;
    }

    # The site's not-found page (prerendered, see `scripts/prerender.mjs`), still with a 404 status.
    # Storybook has none, so it keeps nginx's.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
