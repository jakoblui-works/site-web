server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # No nginx version in headers and error pages.
    server_tokens off;

    location / {
        add_header 'Access-Control-Allow-Origin' '*' always;
        # Every page is a real file (the site is one page; `?xray=…` is still `/`), so anything
        # else is a 404, not the home page under another URL.
        try_files $uri $uri/ =404;
    }

    # The site's not-found page (prerendered, see `scripts/prerender.mjs`), still with a 404 status.
    # Storybook has none, so it keeps nginx's.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}