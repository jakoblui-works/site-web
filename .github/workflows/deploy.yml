name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build --secret id=npm_token,env=NODE_AUTH_TOKEN -t ghcr.io/jakoblui-works/site-web:${{ github.sha }} -t ghcr.io/jakoblui-works/site-web:latest .
          docker push ghcr.io/jakoblui-works/site-web:${{ github.sha }}
          docker push ghcr.io/jakoblui-works/site-web:latest
  build-storybook:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build -f Dockerfile.storybook --secret id=npm_token,env=NODE_AUTH_TOKEN -t ghcr.io/jakoblui-works/site-web-storybook:${{ github.sha }} -t ghcr.io/jakoblui-works/site-web-storybook:latest .
          docker push ghcr.io/jakoblui-works/site-web-storybook:${{ github.sha }}
          docker push ghcr.io/jakoblui-works/site-web-storybook:latest
  trigger-deploy:
    needs: [build, build-storybook]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/jakoblui-works/infra/dispatches -f event_type=deploy
